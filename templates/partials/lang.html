{% load i18n %}{% get_current_language as LANG %}
<form class="lang" action="{% url 'set_language' %}" method="post">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% if LANG == "ar" %}<input type="hidden" name="language" value="en"><button type="submit" lang="en" title="Switch to English">English</button>
  {% else %}<input type="hidden" name="language" value="ar"><button type="submit" lang="ar" title="التبديل إلى العربية">العربية</button>{% endif %}
</form>
